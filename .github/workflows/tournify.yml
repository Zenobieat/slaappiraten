name: Tournify bijwerken

on:
  schedule:
    - cron: "17 */3 * * *"     # elke 3 uur
    - cron: "*/30 19-22 * * 3" # woensdagavond elk half uur (UTC)
  workflow_dispatch: {}          # handmatig starten via het tabblad Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run sync
      - name: Wijzigingen opslaan
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "tournify-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/tournify.json
            git commit -m "Tournify bijgewerkt"
            git push
          else
            echo "Niets veranderd."
          fi
